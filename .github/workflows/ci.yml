name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build:web

  contracts:
    name: Foundry contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned Solidity dependencies
        working-directory: contracts
        run: |
          forge install --no-git eth-infinitism/account-abstraction@v0.8.0
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.4.0
          forge install --no-git foundry-rs/forge-std@v1.9.7

      - name: Build
        working-directory: contracts
        run: forge build

      - name: Test
        working-directory: contracts
        run: forge test -vvv
